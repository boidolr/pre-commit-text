name: Tests
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    - cron: "5 7 */9 * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    strategy:
      matrix:
        python-version: ["311", "312", "313", "314", "314t", "315"]
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: boidolr/actions/run-tox@4f0cba0673e67b0bfb753d6daf29846ab07c3bd0 # main
        with:
          python-version: ${{ matrix.python-version }}

  precommit:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: boidolr/actions/run-precommit@4f0cba0673e67b0bfb753d6daf29846ab07c3bd0 # main
        env:
          UV_PYTHON: "3.15"
